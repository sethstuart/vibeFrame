{# Shared by every page that renders the library cards: the Library page and
   the Collections tabs. The cards' @click handlers reference libraryPage(),
   so both templates must include this — keeping the component in one place
   is what stops the two pages drifting apart. #}
<script>
  // Single Alpine component combining multi-select and lightbox state for
  // the library grid pages. Keeps the photo card's @click handler readable.
  function libraryPage() {
    return {
      mode: false,
      ids: new Set(),
      // Favorite state, seeded from the server so the star badge/button
      // reflect reality on load and update instantly on click (the POST/
      // DELETE persists in the background).
      favs: new Set({{ favorite_ids|list|tojson }}),
      lbOpen: false,
      lbId: null,
      lbPath: null,
      // Collection picker. pickerIds is the images being edited — one from a
      // card button, or the whole selection from the bulk bar.
      pickerIds: [],
      picked: new Set(),
      pickerBusy: false,
      _cols: null,
      toggleMode() { this.mode = !this.mode; if (!this.mode) this.ids.clear(); },
      toggle(id) {
        if (this.ids.has(id)) this.ids.delete(id); else this.ids.add(id);
        this.ids = new Set(this.ids);
      },
      has(id) { return this.ids.has(id); },
      get count() { return this.ids.size; },
      list() { return Array.from(this.ids); },
      clear() { this.ids = new Set(); },
      isFav(id) { return this.favs.has(id); },
      toggleFav(id) {
        const wasFav = this.favs.has(id);
        if (wasFav) this.favs.delete(id); else this.favs.add(id);
        this.favs = new Set(this.favs);   // reassign for reactivity
        fetch(`/favorites/${id}`, { method: wasFav ? 'DELETE' : 'POST' })
          .catch(() => {
            // Revert the optimistic flip if the request failed.
            if (wasFav) this.favs.add(id); else this.favs.delete(id);
            this.favs = new Set(this.favs);
          });
      },
      // Read once from a data-* attribute rather than interpolated into an
      // Alpine expression: tojson emits double quotes and would break out of
      // the attribute (see CLAUDE.md).
      get allCollections() {
        if (this._cols === null) {
          const el = document.getElementById('collections-data');
          try { this._cols = el ? JSON.parse(el.dataset.collections) : []; }
          catch (e) { this._cols = []; }
        }
        return this._cols;
      },
      get pickerLabel() {
        const n = this.pickerIds.length;
        return n === 1 ? 'This photo' : `${n} photos`;
      },
      async openPicker(id) {
        this.pickerIds = [id];
        this.picked = new Set();
        // Fetched on open, not embedded per card: with infinite scroll the page
        // doesn't know up front which cards it will end up holding.
        try {
          const r = await fetch(`/collections/for-image/${id}`);
          if (r.ok) this.picked = new Set((await r.json()).collection_ids);
        } catch (e) { /* leave everything unchecked; a click still works */ }
      },
      openBulkPicker() {
        // No shared starting state across a mixed selection, so start blank:
        // ticking a box adds all of them, unticking removes all of them.
        this.pickerIds = this.list();
        this.picked = new Set();
      },
      closePicker() { this.pickerIds = []; this.picked = new Set(); this.pickerBusy = false; },
      async togglePick(cid) {
        if (this.pickerBusy) return;
        const adding = !this.picked.has(cid);
        if (adding) this.picked.add(cid); else this.picked.delete(cid);
        this.picked = new Set(this.picked);
        this.pickerBusy = true;
        const ids = this.pickerIds;
        try {
          if (ids.length === 1) {
            const url = `/collections/${cid}/images/${ids[0]}`;
            const r = await fetch(url, { method: adding ? 'POST' : 'DELETE' });
            if (!r.ok) throw new Error(r.status);
          } else {
            const r = await fetch(`/collections/${cid}/bulk`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ids, member: adding }),
            });
            if (!r.ok) throw new Error(r.status);
          }
          // Favourites is a collection like any other, so the star has to
          // follow when the picker touches it.
          const favId = this.allCollections.length ? this.allCollections[0].id : null;
          if (cid === favId) {
            for (const id of ids) {
              if (adding) this.favs.add(id); else this.favs.delete(id);
            }
            this.favs = new Set(this.favs);
          }
        } catch (e) {
          if (adding) this.picked.delete(cid); else this.picked.add(cid);
          this.picked = new Set(this.picked);
        } finally {
          this.pickerBusy = false;
        }
      },
      openLightbox(id, path) { this.lbId = id; this.lbPath = path; this.lbOpen = true; },
      closeLightbox() { this.lbOpen = false; this.lbId = null; this.lbPath = null; },
    };
  }
</script>
